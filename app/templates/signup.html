{% extends "base.html" %}
{% block content %}
<main class="auth-screen">
  <section class="auth-card">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 120 120" role="img">
        <circle cx="86" cy="34" r="12" />
        <circle cx="36" cy="86" r="12" />
        <path d="M60 10 A50 50 0 0 0 10 60 L60 60 Z" />
        <path d="M60 110 A50 50 0 0 0 110 60 L60 60 Z" />
      </svg>
    </div>

    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form class="auth-form" action="/signup" method="post">
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label>
        Username
        <input type="text" name="username" placeholder="yourname" required />
      </label>
      <label>
        Password
        <input type="password" name="password" placeholder="••••••••" required />
      </label>

      <button type="submit" class="primary-btn">Sign Up</button>
    </form>

    <p class="auth-switch">Already has an account? <a href="/signin">Sign In</a></p>
  </section>
</main>
{% endblock %}
