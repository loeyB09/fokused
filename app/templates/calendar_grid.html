{% extends "base.html" %}
{% block content %}
<main class="page">
  <header class="page-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 120 120" role="img">
          <circle cx="86" cy="34" r="12" />
          <circle cx="36" cy="86" r="12" />
          <path d="M60 10 A50 50 0 0 0 10 60 L60 60 Z" />
          <path d="M60 110 A50 50 0 0 0 110 60 L60 60 Z" />
        </svg>
      </div>
      <h1>Welcome back @{{ username or "user" }}</h1>
    </div>
  </header>

  <section class="calendar-grid-view" id="calendarGridView">
    <div class="planner-head">
      <h2 id="plannerTitle">Year planner</h2>
      <a class="planner-back" href="/calendar">Timeline view</a>
    </div>
  </section>
</main>
{% endblock %}
{% block bottom_nav %}
{% include "partials/bottom_nav.html" %}
{% endblock %}
