{% extends "base.html" %}
{% block content %}
<main class="page">
  <header class="page-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 120 120" role="img">
          <circle cx="86" cy="34" r="12" />
          <circle cx="36" cy="86" r="12" />
          <path d="M60 10 A50 50 0 0 0 10 60 L60 60 Z" />
          <path d="M60 110 A50 50 0 0 0 110 60 L60 60 Z" />
        </svg>
      </div>
      <h1>Welcome back @{{ username or "user" }}</h1>
    </div>
  </header>

  <section class="calendar-timeline" id="calendarTimeline" aria-live="polite">
    <div class="calendar-hint">Scroll up for previous days. Scroll down for future days.</div>
  </section>

  <a class="calendar-fab" href="/calendar-grid" aria-label="Switch to planner view">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1h3zm12 8H5v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z" />
    </svg>
  </a>
</main>
{% endblock %}
{% block bottom_nav %}
{% include "partials/bottom_nav.html" %}
{% endblock %}
